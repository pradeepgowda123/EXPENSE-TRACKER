<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Expense Management Platform</title>

    <link rel="stylesheet" href="style.css">
</head>

<body>

    <div class="container">

        <!-- Header -->
        <header class="header">
            <h1>Expense Management</h1>
            <p>Track your income, expenses and financial balance.</p>
        </header>


        <!-- Summary Cards -->
        <section class="summary">

            <div class="card balance-card">
                <div class="card-title">Current Balance</div>

                <div class="card-value">
                    ₹<span id="balance">0.00</span>
                </div>
            </div>


            <div class="card income-card">
                <div class="card-title">Total Income</div>

                <div class="card-value">
                    ₹<span id="income">0.00</span>
                </div>
            </div>


            <div class="card expense-card">
                <div class="card-title">Total Expenses</div>

                <div class="card-value">
                    ₹<span id="expense">0.00</span>
                </div>
            </div>

        </section>


        <!-- Main Content -->
        <main class="main-grid">

            <!-- Add Transaction -->
            <section class="panel">

                <h2>Add Transaction</h2>

                <form id="transactionForm">

                    <div class="form-group">

                        <label for="title">
                            Title
                        </label>

                        <input
                            type="text"
                            id="title"
                            placeholder="e.g. Grocery shopping"
                            required
                        >

                    </div>


                    <div class="form-group">

                        <label for="amount">
                            Amount
                        </label>

                        <input
                            type="number"
                            id="amount"
                            placeholder="Enter amount"
                            min="1"
                            step="0.01"
                            required
                        >

                    </div>


                    <div class="form-group">

                        <label for="type">
                            Type
                        </label>

                        <select id="type">

                            <option value="expense">
                                Expense
                            </option>

                            <option value="income">
                                Income
                            </option>

                        </select>

                    </div>


                    <div class="form-group">

                        <label for="category">
                            Category
                        </label>

                        <select id="category">

                            <option value="auto">
                                Auto Detect
                            </option>

                            <option value="Food">
                                Food
                            </option>

                            <option value="Transport">
                                Transport
                            </option>

                            <option value="Shopping">
                                Shopping
                            </option>

                            <option value="Bills">
                                Bills
                            </option>

                            <option value="Entertainment">
                                Entertainment
                            </option>

                            <option value="Health">
                                Health
                            </option>

                            <option value="Education">
                                Education
                            </option>

                            <option value="Salary">
                                Salary
                            </option>

                            <option value="Other">
                                Other
                            </option>

                        </select>

                    </div>


                    <div class="form-group">

                        <label for="date">
                            Date
                        </label>

                        <input
                            type="date"
                            id="date"
                            required
                        >

                    </div>


                    <button
                        type="submit"
                        class="btn add-btn"
                    >
                        Add Transaction
                    </button>

                </form>

            </section>


            <!-- Transactions -->
            <section class="panel">

                <h2>Transactions</h2>

                <div class="filters">

                    <input
                        type="text"
                        id="search"
                        placeholder="Search transactions..."
                    >


                    <select id="filterType">

                        <option value="all">
                            All
                        </option>

                        <option value="income">
                            Income
                        </option>

                        <option value="expense">
                            Expenses
                        </option>

                    </select>

                </div>


                <ul
                    id="transactionList"
                    class="transaction-list"
                ></ul>

            </section>

        </main>

    </div>


    <!-- Notification -->
    <div
        id="notification"
        class="notification"
    ></div>


    <script src="script.js"></script>

</body>

</html>
